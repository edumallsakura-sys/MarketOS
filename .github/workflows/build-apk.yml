name: Build newest uploaded OneClick ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - '**/*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-oneclick:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find newest committed ZIP and extract
        shell: bash
        run: |
          set -euo pipefail
          best=""; best_ts=0
          while IFS= read -r -d '' f; do
            ts=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            if [ "$ts" -ge "$best_ts" ]; then best_ts="$ts"; best="$f"; fi
          done < <(find . -type f -iname '*.zip' -print0)
          if [ -z "$best" ]; then echo "No ZIP found"; exit 1; fi
          echo "Using $best"
          rm -rf build_source && mkdir build_source
          unzip -q "$best" -d build_source
          project=$(find build_source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -1)
          if [ -z "$project" ]; then echo "No Android Gradle project found"; exit 1; fi
          echo "PROJECT_DIR=$project" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          apk=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*debug.apk' | head -1)
          test -n "$apk"
          cp "$apk" release/LinguaMentor-latest.apk
          sha256sum release/LinguaMentor-latest.apk > release/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LinguaMentor-APK
          path: release/*
          if-no-files-found: error
          retention-days: 30
