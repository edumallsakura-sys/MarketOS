name: Build X Dubbing Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract clean project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build_source
          mkdir -p build_source

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -1)"
          test -n "$ZIP_FILE"

          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d build_source

      - name: Detect project directory
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT_DIR="$(find build_source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -1)"
          test -n "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -euxo pipefail

          APK_PATH="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' | head -1)"
          test -n "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK found: $APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X-Dubbing-Studio-v2-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
